stages:
  - deploy

update-image-and-deploy:
  stage: deploy
  image: alpine:3.21
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "web"'
  before_script:
    - apk add --no-cache curl git python3
  script:
    - |
      set -eu

      : "${APP_IMAGE:?APP_IMAGE was not passed by the era4s pipeline}"
      case "$APP_IMAGE" in
        docker.io/michaelbaumanns/era4s:*) ;;
        *) echo "Unexpected APP_IMAGE: $APP_IMAGE" >&2; exit 1 ;;
      esac
      case "$APP_IMAGE" in
        *[!A-Za-z0-9._:/-]*) echo "Invalid image reference characters" >&2; exit 1 ;;
      esac

      export APP_IMAGE
      python3 - <<'PY'
      import os
      from pathlib import Path

      path = Path("compose/docker-compose.yml")
      text = path.read_text()
      old_image = "    image: docker.io/michaelbaumanns/era4s:latest-amd64"
      new_image = "    image: " + os.environ["APP_IMAGE"]
      if text.count(old_image) != 1:
          raise SystemExit("Expected compose image placeholder exactly once; refusing unsafe update")
      path.write_text(text.replace(old_image, new_image))
      PY

      git config user.name "era4s deployment bot"
      git config user.email "era4s-deployment-bot@users.noreply.gitlab.com"
      git add compose/docker-compose.yml
      if git diff --cached --quiet; then
        echo "Compose already references ${APP_IMAGE}; no commit needed."
      else
        git commit -m "Deploy era4s image ${APP_IMAGE##*:}"
        : "${DEPLOY_PUSH_USERNAME:?Set DEPLOY_PUSH_USERNAME as a protected CI/CD variable}"
        : "${DEPLOY_PUSH_TOKEN:?Set DEPLOY_PUSH_TOKEN as a masked protected CI/CD variable}"

        # Keep credentials out of the remote URL and .git/config.
        ASKPASS="$(mktemp)"
        trap 'rm -f "$ASKPASS"' EXIT
        cat > "$ASKPASS" <<'SH'
      #!/bin/sh
      case "$1" in
        *Username*) printf '%s\n' "$DEPLOY_PUSH_USERNAME" ;;
        *Password*) printf '%s\n' "$DEPLOY_PUSH_TOKEN" ;;
        *) exit 1 ;;
      esac
      SH
        chmod 700 "$ASKPASS"
        export GIT_ASKPASS="$ASKPASS"
        export GIT_TERMINAL_PROMPT=0
        git remote set-url origin "https://${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
        git -c credential.helper= push origin "HEAD:${CI_COMMIT_REF_NAME}"
      fi

      if [ -z "${PORTAINER_GITOPS_WEBHOOK:-}" ]; then
        echo "PORTAINER_GITOPS_WEBHOOK is not configured" >&2
        exit 1
      fi
      curl --fail --silent --show-error --request POST "${PORTAINER_GITOPS_WEBHOOK}"
